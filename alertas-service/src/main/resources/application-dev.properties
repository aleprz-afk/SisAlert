# Perfil de desarrollo local (activo por defecto).
# Valores pensados para el PostgreSQL del README:
#   docker run -d --name sisalert-db -p 5432:5432 \
#     -e POSTGRES_DB=sisalert -e POSTGRES_USER=sisalert -e POSTGRES_PASSWORD=sisalert postgres:16-alpine
# Las mismas variables de entorno de producción siguen funcionando para sobrescribirlos.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sisalert}
spring.datasource.username=${DB_USER:sisalert}
spring.datasource.password=${DB_PASSWORD:sisalert}

alertas.cors.origenes=${ALERTAS_CORS_ORIGENES:http://localhost:5173,http://127.0.0.1:5173}

# Monitoreo cada minuto para ver los cambios rápido durante pruebas y demostraciones.
alertas.monitoreo-automatico.intervalo-ms=60000
