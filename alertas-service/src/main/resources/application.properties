spring.application.name=alertas-service
server.port=8080

# H2 en memoria
spring.datasource.url=jdbc:h2:mem:alertasdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# Umbrales de lluvia acumulada del día (mm). Se cambian aquí, sin recompilar.
alertas.umbral.precaucion-mm=30
alertas.umbral.peligro-mm=60