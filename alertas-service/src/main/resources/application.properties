spring.application.name=alertas-service
server.port=8081

# Perfiles:
#   dev  (por defecto) -> valores locales listos para usar (application-dev.properties)
#   prod (Azure)       -> SPRING_PROFILES_ACTIVE=prod; todo sale de variables de entorno
#                         y el servicio NO arranca si falta alguna (application-prod.properties)
spring.profiles.default=dev

# Base de datos PostgreSQL persistente. Sin valores por defecto aquí: las credenciales
# nunca van en el repositorio. En dev las completa application-dev.properties.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# El esquema lo crea y versiona Flyway (src/main/resources/db/migration).
# Hibernate solo comprueba que las entidades coincidan con las tablas.
# Las tablas viven en el esquema "alertas" de la base compartida; la API de identidad
# usa el esquema "identidad". Así cada servicio tiene su propio espacio y migraciones,
# y en la nube se le puede dar a cada uno un usuario con permisos solo sobre su esquema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=alertas
spring.flyway.enabled=true
spring.flyway.schemas=alertas
spring.flyway.default-schema=alertas

# Umbrales de lluvia acumulada en la ventana de 24 h disponible (mm).
# 40 mm: umbral "fuerte" adaptado para Villavicencio (alerta temprana).
# 80 mm: umbral "muy fuerte" / riesgo real de creciente.
alertas.umbral.precaucion-mm=40
alertas.umbral.peligro-mm=80

# Fuente de datos:
#   "open-meteo" -> Datos meteorológicos reales en vivo por satélite/estación para Villavicencio
#   "ideam"      -> Datos abiertos del IDEAM (datos.gov.co)
#   "simulada"   -> Datos simulados de respaldo para demostración (aleatorios)
#   "escenario"  -> Resultados fijos para demostrar con lluvia (ver alertas.escenario)
# Se puede cambiar sin editar este archivo con la variable de entorno ALERTAS_FUENTE.
alertas.fuente=open-meteo

# Solo con alertas.fuente=escenario: seca | tormenta | creciente
# (variable de entorno ALERTAS_ESCENARIO).
alertas.escenario=tormenta

# Token de aplicación del portal datos.gov.co (opcional pero recomendado).
# Obtener en: https://www.datos.gov.co → cuenta → Developer Settings → Create New App Token
# NO subir el token real al repositorio: definirlo como variable de entorno.
# En local: set ALERTAS_IDEAM_APP_TOKEN=tu_token (Windows) o export (Linux/Mac)
alertas.ideam.app-token=${ALERTAS_IDEAM_APP_TOKEN:}

# JWT emitido por la API de identidad. Se usan los MISMOS nombres de variable que en .NET,
# así una sola variable (o secreto de Key Vault) configura ambos servicios.
# La clave no tiene valor por defecto: en dev la pone application-dev.properties.
alertas.jwt.clave=${Jwt__Key}
alertas.jwt.emisor=${Jwt__Issuer:MiniIdentityApi}
alertas.jwt.audiencia=${Jwt__Audience:MiniIdentityApiUsers}

# Orígenes permitidos por CORS (lista separada por comas). Obligatorio: en dev lo
# define application-dev.properties y en prod la variable ALERTAS_CORS_ORIGENES.
alertas.cors.origenes=${ALERTAS_CORS_ORIGENES}

# ==============================================================================
# MONITOREO AUTÓNOMO 24/7 (Vigilancia en segundo plano sin intervención manual)
# ==============================================================================
alertas.monitoreo-automatico.habilitado=true
# Intervalo de escaneo en milisegundos. 900000 ms = 15 min (Open-Meteo actualiza cada hora;
# más seguido solo llena la base). En dev se usa 1 minuto para ver el efecto rápido.
# Variable de entorno: ALERTAS_MONITOREO_AUTOMATICO_INTERVALO_MS
alertas.monitoreo-automatico.intervalo-ms=900000
