spring.application.name=alertas-service
server.port=8081

# H2 en memoria
spring.datasource.url=jdbc:h2:mem:alertasdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Umbrales de lluvia acumulada en la ventana de 24 h disponible (mm).
# 40 mm: umbral "fuerte" adaptado para Villavicencio (alerta temprana).
# 80 mm: umbral "muy fuerte" / riesgo real de creciente.
alertas.umbral.precaucion-mm=40
alertas.umbral.peligro-mm=80

# Fuente de datos:
#   "open-meteo" -> Datos meteorológicos reales en vivo por satélite/estación para Villavicencio
#   "ideam"      -> Datos abiertos del IDEAM (datos.gov.co)
#   "simulada"   -> Datos simulados de respaldo para demostración
alertas.fuente=open-meteo

# Token de aplicación del portal datos.gov.co (opcional pero recomendado).
# Obtener en: https://www.datos.gov.co → cuenta → Developer Settings → Create New App Token
# NO subir el token real al repositorio: definirlo como variable de entorno.
# En local: set ALERTAS_IDEAM_APP_TOKEN=tu_token (Windows) o export (Linux/Mac)
alertas.ideam.app-token=${ALERTAS_IDEAM_APP_TOKEN:}

# Orígenes permitidos por CORS (el frontend de Vite)
alertas.cors.origenes=http://localhost:5173,http://127.0.0.1:5173
