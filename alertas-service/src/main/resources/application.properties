spring.application.name=alertas-service
server.port=8081

# ==============================================================================
# BASE DE DATOS: MySQL (sisalert_db)
# ==============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sisalert_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:2005}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Respaldo H2 (descomentar solo si un compañero no tiene MySQL instalado)
# spring.datasource.url=jdbc:h2:mem:alertasdb
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.hibernate.ddl-auto=create-drop
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# Umbrales de lluvia acumulada en la ventana de 24 h disponible (mm).
# 40 mm: umbral "fuerte" adaptado para Villavicencio (alerta temprana).
# 80 mm: umbral "muy fuerte" / riesgo real de creciente.
alertas.umbral.precaucion-mm=40
alertas.umbral.peligro-mm=80

# Fuente de datos:
#   "open-meteo" -> Datos meteorológicos reales en vivo por satélite/estación para Villavicencio
#   "ideam"      -> Datos abiertos del IDEAM (datos.gov.co)
#   "simulada"   -> Datos simulados de respaldo para demostración
alertas.fuente=simulada

# Token de aplicación del portal datos.gov.co (opcional pero recomendado).
# Obtener en: https://www.datos.gov.co → cuenta → Developer Settings → Create New App Token
# NO subir el token real al repositorio: definirlo como variable de entorno.
# En local: set ALERTAS_IDEAM_APP_TOKEN=tu_token (Windows) o export (Linux/Mac)
alertas.ideam.app-token=${ALERTAS_IDEAM_APP_TOKEN:}

# Orígenes permitidos por CORS (el frontend de Vite)
alertas.cors.origenes=http://localhost:5173,http://127.0.0.1:5173

# ==============================================================================
# MONITOREO AUTÓNOMO 24/7 (Vigilancia en segundo plano sin intervención manual)
# ==============================================================================
alertas.monitoreo-automatico.habilitado=true
# Intervalo de escaneo en milisegundos (60000 ms = 1 minuto en demo / pruebas)
alertas.monitoreo-automatico.intervalo-ms=60000
