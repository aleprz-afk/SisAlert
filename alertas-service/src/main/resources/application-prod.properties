# Perfil de producción (Azure). Se activa con SPRING_PROFILES_ACTIVE=prod.
# Variables obligatorias (el servicio no arranca si falta alguna):
#   DB_URL                 jdbc:postgresql://<servidor>.postgres.database.azure.com:5432/sisalert?sslmode=require
#                          (SSL obligatorio; el verificador de arranque rechaza la URL si no lo pide)
#   DB_USER / DB_PASSWORD  credenciales del usuario de la base (desde Key Vault)
#   ALERTAS_CORS_ORIGENES  origen(es) del frontend desplegado, p. ej. https://sisalert.azurestaticapps.net
#   Jwt__Key               la misma clave de firma que usa la API de identidad

# Pool pequeño: el plan básico de Azure PostgreSQL admite pocas conexiones simultáneas.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
# Renueva las conexiones antes de que el balanceador de Azure corte las inactivas, y no
# espera indefinidamente si la base no responde.
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.connection-timeout=10000

# Nunca exponer detalles internos en las respuestas de error.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
