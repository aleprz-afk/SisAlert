# Perfil de pruebas: H2 en memoria para no necesitar PostgreSQL en `mvnw test`.
spring.datasource.url=jdbc:h2:mem:alertasdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# Seguridad y CORS para las pruebas de controladores (@WebMvcTest).
alertas.jwt.clave=clave-de-pruebas-unitarias-con-mas-de-32-caracteres
alertas.jwt.emisor=MiniIdentityApi
alertas.jwt.audiencia=MiniIdentityApiUsers
alertas.cors.origenes=http://localhost:5173
