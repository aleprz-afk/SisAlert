# Integración continua de SisAlert.
# En cada pull request y en cada push a develop/main:
#   1. pruebas de los 4 servicios (en paralelo)
#   2. análisis de dependencias con vulnerabilidades conocidas
#   3. construcción de las 4 imágenes Docker (solo si todo lo anterior pasó)
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

# Solo lectura del repositorio: el CI no publica nada.
permissions:
  contents: read

# Si llega un push nuevo a la misma rama, se cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  alertas:
    name: alertas-service (Java 17 · Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alertas-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Pruebas
        run: chmod +x mvnw && ./mvnw -B test

  auth:
    name: auth-service (.NET 10)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Pruebas
        run: dotnet test --configuration Release

  ai:
    name: ai-service (Python · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Misma versión con la que se entrenó modelo/modelo.joblib.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ai-service/requirements-dev.txt
      - name: Dependencias
        run: pip install -r requirements-dev.txt
      - name: Pruebas
        run: python -m pytest -q

  frontend:
    name: frontend (React · lint y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  seguridad:
    name: Dependencias con vulnerabilidades conocidas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: .NET (paquetes directos y transitivos)
        working-directory: auth-service
        run: |
          dotnet restore
          dotnet list package --vulnerable --include-transitive | tee reporte.txt
          if grep -q "has the following vulnerable packages" reporte.txt; then
            echo "::error::Hay paquetes .NET con vulnerabilidades conocidas"
            exit 1
          fi
      - name: npm (dependencias de producción, severidad alta o crítica)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Python (dependencias del servicio de IA)
        working-directory: ai-service
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --progress-spinner off

  imagenes:
    name: Imagen Docker · ${{ matrix.servicio }}
    needs: [alertas, auth, ai, frontend, seguridad]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio: [alertas-service, auth-service, ai-service, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir (sin publicar)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.servicio }}
          push: false
          tags: sisalert/${{ matrix.servicio }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.servicio }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servicio }}
